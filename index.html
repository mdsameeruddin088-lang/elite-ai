<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Elite AI</title><link rel="stylesheet" href="/style.css"><link rel="manifest" href="/manifest.json"><link rel="icon" href="/icon.svg"><meta name="theme-color" content="#0A1226"><script>if("serviceWorker" in navigator)navigator.serviceWorker.register("/sw.js")</script></head><body>
<aside id="side">
  <div class="brand"><div class="logo"></div>Elite AI</div>
  <button class="new" id="new">+ New chat</button>
  <div id="list"></div>
  <div class="stat"><span class="dot" id="dot"></span><span id="st">Checking model…</span></div>
</aside>
<main>
  <button id="menu">☰</button>
  <div id="log"><div class="wrap" id="wrap"></div></div>
  <div class="dock"><div class="box">
    <textarea id="t" rows="1" placeholder="Message Elite AI…"></textarea>
    <button id="go" title="Send">↑</button>
  </div><div class="note">Runs 100% on your device. No internet. No data leaves it.</div></div>
</main>
<script src="/app.js"></script></body></html>
